<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo-Home</title>
    </head>
    <body>
       <h1>My Tasks</h1>

       <div>
         {% for task in task %}
         <h2>{{ task.title }}</h2>
            <p>{{ task.description }}</p>
            {% empty %}
            <h2>No tasks available</h2>
            
         {% endfor %}
         </div>
    </body>
</html>
