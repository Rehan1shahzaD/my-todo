<!DOCTYPE html>
<html>
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Todo-Home</title>
    </head>
    <body>
        <h1>My Tasks</h1>

        <form method="post">
            {% csrf_token %}
            {{ form.as_p }}
            <button type="submit">Add Task</button>
        </form>


        <div>
            {% for task in tasks %}
                <h2>{{ task.title }}</h2>
                <p>{{ task.description }}</p>
                <div>
                    <a href="{% url 'update' task.id %}">Edit</a>
                    <a href="">Delete</a>
                </div>
                    
            {% empty %}
                <h2>No tasks available</h2>
            {% endfor %}
        </div>
    </body>
</html>
