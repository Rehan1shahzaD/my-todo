{%load static%}
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewsport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'styles.css'%}">
    <title> TODO-Delete </title>
</head>

<body>
    <header class"header">
        <h1 class="title">📔Delete Task</h1>
    </header>

    <main class="delete-section">
        <h2 class="delete-message">
            Are you sure you want to delete
            <span class="delete-task">"{{task.title}}"?</span>
        </h2>
        <form action="" class="post" class="delete-form">
            {% csrf_token %}
            <div class="delete-button">
                <button type="submit" class="btn confirm-delete">Yes,delete</button>
                <a href="{% url 'home'%}" class="btn cancel-delete">cancel</a>
            </div>
        </form>
    </main>
</body>

</html>
